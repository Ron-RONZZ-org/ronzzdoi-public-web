name: Deploy ronzzdoi-public-web
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 158.178.193.231
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo -u ronzz git -C /opt/ronzzdoi-public-web pull origin main
            sudo -u ronzz HOME=/opt/ronzzdoi-public-web npm ci --prefix /opt/ronzzdoi-public-web
            sudo -u ronzz HOME=/opt/ronzzdoi-public-web npm run build --prefix /opt/ronzzdoi-public-web
            sudo systemctl restart ronzzdoi-web
            sleep 2
            sudo systemctl status ronzzdoi-web --no-pager | head -5
            echo "=== Deploy OK ==="
