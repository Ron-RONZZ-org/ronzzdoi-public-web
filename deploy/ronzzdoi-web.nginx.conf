server {
    listen 80;
    server_name doi.ronzz.org;

    # Redirect to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name doi.ronzz.org;

    # SSL certificates — adjust paths for your setup
    ssl_certificate     /etc/letsencrypt/live/doi.ronzz.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doi.ronzz.org/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Proxy to Astro Node.js server
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/ronzzdoi-web.access.log;
    error_log  /var/log/nginx/ronzzdoi-web.error.log;
}
